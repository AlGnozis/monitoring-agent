name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  quality:
    name: Lint + Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
          if [ -f pyproject.toml ]; then pip install -e ".[dev]" || pip install ruff pytest mypy; fi
          # Минимальный fallback: пока проект пустой, ставим хотя бы линтер и тестраннер
          pip install ruff pytest

      - name: Lint with ruff
        run: |
          if [ -d app ] || [ -d tests ]; then
            ruff check .
            ruff format --check .
          else
            echo "::notice::No app/ or tests/ yet — skipping ruff"
          fi

      - name: Type check with mypy
        run: |
          if [ -d app ]; then
            mypy app/
          else
            echo "::notice::No app/ yet — skipping mypy"
          fi

      - name: Run tests
        run: |
          if [ -d tests ] && [ -n "$(ls -A tests 2>/dev/null)" ]; then
            pytest -q
          else
            echo "::notice::No tests yet — skipping pytest"
          fi
