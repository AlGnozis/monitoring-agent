[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "monitoring-agent"
version = "0.1.0"
description = "AI-агент мониторинга IT-инцидентов: RSS → триаж GigaChat → RAG → owner → mock-заявка/письмо"
requires-python = ">=3.12"
license = { text = "MIT" }
dependencies = [
    "fastapi",
    "uvicorn[standard]",
    "pydantic>=2",
    "pydantic-settings",
    "langgraph",
    "langchain-gigachat",
    "langchain-core",
    "langchain-community",
    "faiss-cpu",
    "requests",
    "feedparser",
    "loguru",
    "sqlmodel",
    "pyyaml",
]

[project.optional-dependencies]
dev = ["ruff", "mypy", "pytest", "pytest-cov", "pytest-asyncio", "httpx"]
eval = ["ragas", "datasets"]

[tool.setuptools.packages.find]
include = ["app*"]

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
[tool.ruff.lint.isort]
known-first-party = ["app"]

[tool.mypy]
python_version = "3.12"
strict = false
ignore_missing_imports = true
disallow_untyped_defs = true
files = ["app"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --strict-markers"
